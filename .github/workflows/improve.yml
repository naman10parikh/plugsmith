name: Improve
# The improvement loop: every night, re-run the tests and the golden eval against Claude Code's own validator,
# and compare the plugin.json keys plugsmith knows with Claude Code's manifest reference. Drift becomes an issue
# with a proposed change. It opens issues only; a person reviews and lands every change.
on:
  schedule:
    - cron: "53 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: npm install -g @anthropic-ai/claude-code
      - run: pnpm eval
        env:
          PLUGSMITH_REQUIRE_CLAUDE: "1"
      - name: Compare plugin.json keys with the docs
        id: drift
        run: |
          set +e
          node scripts/field-drift.mjs --out proposal.md
          code=$?
          if [ "$code" -eq 3 ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 0 ]; then exit "$code"; fi
      - name: Open a proposal issue
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="plugsmith: Claude Code's plugin.json keys changed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then gh issue create --title "$title" --body-file proposal.md; fi
