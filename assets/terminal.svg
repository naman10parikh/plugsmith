<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">plugsmith --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">plugsmith 0.1.0 — turn any repository into a Claude Code plugin and marketplace</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Usage:</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">  plugsmith [repo] [--dry] [--force]     write .claude-plugin/plugin.json, marketplace.json and manifest.json</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">                                         (an existing plugin.json or marketplace.json is kept without --force)</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  plugsmith validate [repo] [--claude] [--sandbox=e2b]</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">                                         check plugin.json and marketplace.json the way Claude Code does;</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">                                         --claude also runs the real `claude plugin validate`;</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">                                         --sandbox=e2b runs it in a clean microVM on only the files git tracks</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  plugsmith recall &quot;&lt;query&gt;&quot;             search plugsmith's own memory, lessons, skills and personas</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  plugsmith --version | --help</text>
<text x="24" y="306" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">Then, in Claude Code:  /plugin marketplace add &lt;owner&gt;/&lt;repo&gt;   and   /plugin install &lt;name&gt;@&lt;name&gt;</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">MCP server: plugsmith-mcp (build_plugin, validate_plugin, validate_manifest)</text>
</svg>
